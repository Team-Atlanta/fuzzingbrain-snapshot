name: fuzzing-brain
type:
  - bug-finding
  - bug-fixing
version: 1.0.0
docker_registry: local

prepare_phase:
  hcl: oss-crs/docker-bake.hcl

target_build_phase:
  - name: build
    dockerfile: oss-crs/dockerfiles/builder.Dockerfile
    outputs:
      - build
      - src

crs_run_phase:
  fuzzer:
    dockerfile: oss-crs/dockerfiles/runner.Dockerfile

supported_target:
  mode:
    - full
    - delta
  language:
    - c
    - c++
    - jvm
  sanitizer:
    - address
  architecture:
    - x86_64

required_llms:
  # Primary models
  - claude-opus-4-6
  - claude-sonnet-4-6
  # OpenAI
  - gpt-4o
  - gpt-4.1
  - o3
  # Google
  - gemini-2.5-pro
  - gemini-2.5-flash
