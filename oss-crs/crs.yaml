name: fuzzing-brain
type:
  - bug-finding
  - bug-fixing
version: 1.0.0
docker_registry: local

prepare_phase:
  hcl: oss-crs/docker-bake.hcl

target_build_phase:
  - name: build
    dockerfile: oss-crs/dockerfiles/builder.Dockerfile
    outputs:
      - build
      - src
      - fetch

crs_run_phase:
  fuzzer:
    dockerfile: oss-crs/dockerfiles/runner.Dockerfile

supported_target:
  mode:
    - full
    - delta
  language:
    - c
    - c++
    - jvm
  sanitizer:
    - address
  architecture:
    - x86_64

required_llms:
  # Primary models (MODELS list in strategies)
  - claude-sonnet-4-5-20250929
  - claude-opus-4-20250514
  # Go default + fallback chains
  - claude-sonnet-4-20250514
  - claude-3-5-sonnet-20241022
  - chatgpt-4o-latest
  - gpt-4.1
  - o3
  - gemini-2.5-pro
  - gemini-2.5-flash
